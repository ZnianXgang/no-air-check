# Done to increase the memory available to gradle. Two Minecraft toolchains
# (Fabric Loom and NeoForge ModDevGradle) are configured in the same build.
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
org.gradle.configuration-cache=true

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=26.3
loader_version=0.19.5
loom_version=1.18-SNAPSHOT

# NeoForge Properties
# check these on https://projects.neoforged.net/neoforged/neoforge
# neo_version must agree with minecraft_version to resolve a valid artifact.
neo_version=26.3.0.101
moddev_version=2.0.148
minecraft_version_range=[26.3,)

# Mod Properties
# The Fabric mod id (fabric.mod.json) and the NeoForge mod id (neoforge.mods.toml)
# differ because NeoForge only allows [a-z][a-z0-9_]{1,63}.
mod_version=1.0
mod_group=me.znianxgang.noaircheck
mod_id=no-air-check
neo_mod_id=no_air_check
mod_name=No Air Check
mod_license=CC0-1.0
