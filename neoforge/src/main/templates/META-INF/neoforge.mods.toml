license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="ZnianXgang"
# Server-side only: do not make clients fail the mod-list comparison.
displayTest="IGNORE_ALL_VERSION"
description='''
Disables the vanilla "standing on air" check that logs and force-resends blocks below the player.
'''

# Without this block NeoForge never loads the mixin configuration.
[[mixins]]
config="noaircheck.mixins.json"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"
