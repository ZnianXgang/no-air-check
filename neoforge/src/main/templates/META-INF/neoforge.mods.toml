[[mods]]
modId="no_air_check"
version="${version}"
displayName="No Air Check"
authors="ZnianXgang"
# Server-side only: do not make clients fail the mod-list comparison.
displayTest="IGNORE_ALL_VERSION"
description='''
Disables the vanilla "standing on air" check that logs and force-resends blocks below the player.
'''

# Without this block NeoForge never loads the mixin configuration.
[[mixins]]
config="noaircheck.mixins.json"

[[dependencies.no_air_check]]
modId="neoforge"
type="required"
versionRange="[${neoforge_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.no_air_check]]
modId="minecraft"
type="required"
versionRange="[26.3,)"
ordering="NONE"
side="BOTH"
